<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; }
    a { color: #a78bfa; } a:hover { color: #c4b5fd; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; position: relative; background-color: #0b0d12; color: #e8eaf0; font-size: 13px; overflow: hidden; display: flex; align-items: center; justify-content: center;">

  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background-image: radial-gradient(rgba(255,255,255,0.055) 1.2px, transparent 1.2px); background-size: 26px 26px;"></div>
  <div style="position: absolute; left: 440px; top: -180px; width: 560px; height: 560px; border-radius: 999px; background: radial-gradient(circle, rgba(139,92,246,0.20), rgba(139,92,246,0) 66%);"></div>
  <div style="position: absolute; left: 0; bottom: 0; width: 1440px; height: 300px; background: linear-gradient(to top, #0b0d12, rgba(11,13,18,0));"></div>

  <svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0;">
    <path d="M232 300 H360" stroke="rgba(139,92,246,0.22)" stroke-width="2" fill="none" stroke-linecap="round"></path>
    <path d="M1080 620 H1208" stroke="rgba(139,92,246,0.18)" stroke-width="2" fill="none" stroke-linecap="round"></path>
    <rect x="140" y="282" width="92" height="36" rx="9" fill="#12151c" stroke="rgba(255,255,255,0.06)"></rect>
    <rect x="360" y="282" width="92" height="36" rx="9" fill="#12151c" stroke="rgba(255,255,255,0.06)"></rect>
    <rect x="988" y="602" width="92" height="36" rx="9" fill="#12151c" stroke="rgba(255,255,255,0.06)"></rect>
    <rect x="1208" y="602" width="92" height="36" rx="9" fill="#12151c" stroke="rgba(255,255,255,0.06)"></rect>
    <circle cx="232" cy="300" r="4" fill="#8b5cf6"></circle>
    <circle cx="1080" cy="620" r="4" fill="#8b5cf6"></circle>
  </svg>

  <div style="position: relative; width: 404px; display: flex; flex-direction: column; gap: 26px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(145deg, #8b5cf6, #6d4aff); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 26px rgba(139,92,246,0.4);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><path d="M10 6.5h4a3.5 3.5 0 0 1 3.5 3.5v4"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.025em;">Sign in to Flowgrid</div>
        <div style="font-size: 13.5px; color: #8a90a2;">Enter your workspace credentials to continue.</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 16px; background: #12151c; border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 22px 60px rgba(0,0,0,0.5);">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12.5px; font-weight: 600; color: #b9bfcf;">Email</div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #1a1e28; border: 1px solid rgba(255,255,255,0.07);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b7284" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <span style="font-size: 13.5px;">ha.nguyen@acme.vn</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 12.5px; font-weight: 600; color: #b9bfcf;">Password</span>
          <span style="font-size: 12.5px; font-weight: 600; color: #a78bfa;">Forgot?</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #1a1e28; border: 1.5px solid #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,0.14);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #b9bfcf; letter-spacing: 0.16em;">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
          <div style="flex-grow: 1;"></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b7284" stroke-width="1.8"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 17px; height: 17px; border-radius: 5px; background: #8b5cf6; display: flex; align-items: center; justify-content: center;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"></path></svg>
        </div>
        <span style="font-size: 13px; color: #b9bfcf;">Keep me signed in for 30 days</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; padding: 13px; border-radius: 10px; background: #8b5cf6; color: #ffffff; font-size: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(139,92,246,0.35);">Sign in</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: #565d72;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#565d72" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span>Self-hosted workspace</span>
      <span style="color: #33384a;">&middot;</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px;">flow.acme.vn</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
